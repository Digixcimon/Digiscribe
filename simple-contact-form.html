<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Contact Form</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .form-container {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 500px;
        }

        .form-title {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
            font-weight: 300;
        }

        .info-box {
            background: #e8f4fd;
            border: 1px solid #bee5eb;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 25px;
            color: #0c5460;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 15px;
            border: 2px solid #e1e1e1;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s ease;
            font-family: inherit;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 120px;
        }

        .submit-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .required {
            color: #e74c3c;
        }

        .email-display {
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            padding: 15px;
            margin-top: 15px;
            font-size: 14px;
            color: #666;
        }

        .email-display strong {
            color: #333;
        }

        @media (max-width: 600px) {
            .form-container {
                padding: 30px 20px;
            }
            
            .form-title {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="form-container">
        <h1 class="form-title">Contact Form</h1>
        
        <div class="info-box">
            📧 <strong>How it works:</strong> Fill out the form below and click "Send Email". This will open your default email client (Gmail, Outlook, etc.) with the message pre-filled. Just click send from your email client!
        </div>

        <form id="contactForm">
            <div class="form-group">
                <label for="yourEmail">Your Email Address <span class="required">*</span></label>
                <input type="email" id="yourEmail" name="yourEmail" required placeholder="your-email@example.com">
            </div>

            <div class="form-group">
                <label for="recipientEmail">Send To <span class="required">*</span></label>
                <input type="email" id="recipientEmail" name="recipientEmail" required placeholder="recipient@gmail.com" value="your-email@gmail.com">
                <small style="color: #666; font-size: 12px;">Replace with the actual Gmail address you want to send to</small>
            </div>

            <div class="form-group">
                <label for="name">Your Name <span class="required">*</span></label>
                <input type="text" id="name" name="name" required placeholder="John Doe">
            </div>

            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" name="phone" placeholder="+1 (555) 123-4567">
            </div>

            <div class="form-group">
                <label for="subject">Subject <span class="required">*</span></label>
                <select id="subject" name="subject" required>
                    <option value="">Select a subject</option>
                    <option value="General Inquiry">General Inquiry</option>
                    <option value="Technical Support">Technical Support</option>
                    <option value="Business Proposal">Business Proposal</option>
                    <option value="Feedback">Feedback</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <div class="form-group">
                <label for="message">Message <span class="required">*</span></label>
                <textarea id="message" name="message" placeholder="Please describe your inquiry in detail..." required></textarea>
            </div>

            <button type="submit" class="submit-btn">📧 Send Email</button>

            <div class="email-display" id="emailPreview" style="display: none;">
                <strong>Email Preview:</strong><br>
                <div id="previewContent"></div>
            </div>
        </form>
    </div>

    <script>
        // Update preview as user types
        function updatePreview() {
            const name = document.getElementById('name').value;
            const email = document.getElementById('yourEmail').value;
            const phone = document.getElementById('phone').value;
            const subject = document.getElementById('subject').value;
            const message = document.getElementById('message').value;
            
            if (name || email || subject || message) {
                const preview = document.getElementById('emailPreview');
                const content = document.getElementById('previewContent');
                
                content.innerHTML = `
                    <strong>To:</strong> ${document.getElementById('recipientEmail').value}<br>
                    <strong>Subject:</strong> Contact Form: ${subject || '[Subject]'}<br><br>
                    <strong>Name:</strong> ${name || '[Your Name]'}<br>
                    <strong>Email:</strong> ${email || '[Your Email]'}<br>
                    ${phone ? `<strong>Phone:</strong> ${phone}<br>` : ''}
                    <strong>Subject:</strong> ${subject || '[Subject]'}<br><br>
                    <strong>Message:</strong><br>
                    ${message || '[Your message here]'}
                `;
                
                preview.style.display = 'block';
            } else {
                document.getElementById('emailPreview').style.display = 'none';
            }
        }

        // Add event listeners for real-time preview
        ['name', 'yourEmail', 'phone', 'subject', 'message', 'recipientEmail'].forEach(id => {
            document.getElementById(id).addEventListener('input', updatePreview);
        });

        document.getElementById('contactForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Get form data
            const name = document.getElementById('name').value.trim();
            const yourEmail = document.getElementById('yourEmail').value.trim();
            const recipientEmail = document.getElementById('recipientEmail').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const subject = document.getElementById('subject').value;
            const message = document.getElementById('message').value.trim();
            
            // Basic validation
            if (!name || !yourEmail || !recipientEmail || !subject || !message) {
                alert('Please fill in all required fields.');
                return;
            }

            // Email validation
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(yourEmail) || !emailRegex.test(recipientEmail)) {
                alert('Please enter valid email addresses.');
                return;
            }

            // Create email content
            const emailSubject = `Contact Form: ${subject}`;
            const emailBody = `Hello,

You have received a new message from your website contact form:

Name: ${name}
Email: ${yourEmail}${phone ? `\nPhone: ${phone}` : ''}
Subject: ${subject}

Message:
${message}

---
This message was sent from your website contact form.
You can reply directly to ${yourEmail} to respond.

Best regards,
Website Contact Form`;

            // Create mailto link
            const mailtoLink = `mailto:${recipientEmail}?subject=${encodeURIComponent(emailSubject)}&body=${encodeURIComponent(emailBody)}`;
            
            // Try to open email client
            try {
                window.location.href = mailtoLink;
                
                // Show success message
                setTimeout(() => {
                    alert('📧 Your email client should now open with the message pre-filled. Just click send!\n\nIf it didn\'t open automatically, you can copy the email content from the preview below.');
                }, 500);
                
            } catch (error) {
                alert('Unable to open email client automatically. Please copy the email content from the preview below and send it manually.');
            }
        });

        // Initialize preview
        updatePreview();
    </script>
</body>
</html>
